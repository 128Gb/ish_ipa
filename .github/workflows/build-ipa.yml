name: Build Unsigned iSH IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies (meson, ninja, llvm, lld, cmake)
        run: |
          brew install meson ninja llvm lld cmake

      - name: Point VDSO compiler check to Homebrew LLVM and LLD
        run: |
          LLVM_CLANG="$(brew --prefix llvm)/bin/clang"
          LLD_BIN="$(brew --prefix lld)/bin"
          sed -i '' "s|'clang'|'$LLVM_CLANG', 'clang'|g" vdso/meson.build
          sed -i '' "2i\\
          export PATH=\"\$PATH:$LLD_BIN\"
          " app/xcode-meson.sh

      - name: Configure libarchive (generate config.h)
        run: |
          cd deps/libarchive
          cmake -B build_cfg \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DENABLE_TEST=OFF \
            -DENABLE_TAR=OFF \
            -DENABLE_CPIO=OFF \
            -DENABLE_CAT=OFF \
            -DENABLE_OPENSSL=OFF \
            -DENABLE_ICONV=OFF \
            -DENABLE_LIBXML2=OFF \
            -DENABLE_EXPAT=OFF \
            -DENABLE_ZSTD=OFF \
            -DENABLE_LZ4=OFF \
            -DENABLE_LZMA=OFF \
            -DENABLE_BZip2=OFF
          cp build_cfg/config.h .
          rm -rf build_cfg

      - name: Build iSH.app (Release, Unsigned)
        run: |
          xcodebuild clean build \
            -project iSH.xcodeproj \
            -scheme iSH \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            GCC_WARN_ABOUT_MISSING_PROTOTYPES=NO \
            CLANG_WARN_STRICT_PROTOTYPES=NO \
            OTHER_CFLAGS='$(inherited) -Wno-error=implicit-function-declaration -Wno-implicit-function-declaration -Wno-error=incompatible-function-pointer-types -Wno-error=int-conversion' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/iSH.app Payload/
          zip -r iSH-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iSH-unsigned-ipa
          path: iSH-unsigned-ipa.ipa
